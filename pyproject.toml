[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "collective-brain-mcp"
version = "1.0.0"
description = "Lightweight, production-grade MCP server for shared cross-agent memory, notes, and document knowledge base powered by Qdrant and FastEmbed."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Eve", email = "eve@ciderboi.xyz" },
    { name = "Naman", email = "me@ciderboi.xyz" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "fastembed>=0.4.0",
    "qdrant-client>=1.12.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "pydantic>=2.0.0",
    "psutil>=6.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/ciderboi/collective-brain-mcp"
Repository = "https://github.com/ciderboi/collective-brain-mcp"
